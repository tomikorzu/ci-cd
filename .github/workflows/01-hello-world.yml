name: 01 - Hello World
on: 
    push:
        branches: [dev, staging, production]

jobs: 
    hello:
        runs-on: ubuntu-24.04
        steps: 
            - name: Say hello
              run: echo "Hello world!"
            - name: View runner date
              run: date

    repo-files:
        runs-on: ubuntu-24.04
        steps:
            - name: Download repo contents
              uses: actions/checkout@v6

            - name: View repo files
              run: ls -la